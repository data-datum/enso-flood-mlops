[project]
name = "enso-flood-mlops"
version = "0.1.0"
description = "Sistema de alerta temprana ENSO y predicción hidrológica a 15 días"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.9.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "duckdb>=1.1.0",
    "pyarrow>=18.0.0",
    "pandera[polars]>=0.20.4",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "mlflow>=2.16.0",
    "httpx>=0.27.2",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "loguru>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]