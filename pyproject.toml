[project]
name = "enso-flood-mlops"
version = "0.1.0"
description = "Sistema de alerta temprana ENSO y predicción hidrológica a 15 días"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.9.0",
    "duckdb>=1.1.0",
    "pandera[polars]>=0.20.4",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "loguru>=0.7.2",
    "pyarrow==26.0.1",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]